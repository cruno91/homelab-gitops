---
# Wildcard cert for dev's Traefik Gateway HTTPS listener.
#
# Same model as edge and mgmt: a per-cluster wildcard, so the blast radius of a
# leak is one cluster's hostnames rather than the whole homelab. Issued by
# Let's Encrypt over DNS-01 using the Cloudflare token in
# platform/cert-manager/extras/cloudflare-token.enc.yaml.
#
# TLS wildcard matching (RFC 6125) is one label deep: *.dev.wretchedhive.io
# matches app.dev.wretchedhive.io but NOT foo.bar.dev.wretchedhive.io. Keep
# hostnames flat under this level.
#
# Issued by letsencrypt-prod after the DNS-01 flow was validated end-to-end
# against letsencrypt-staging (2026-10-17: staging cert Ready, served by the
# Gateway on all three nodes). Swap issuerRef.name back to letsencrypt-staging
# if debugging cert-manager or Cloudflare changes, to stay clear of LE prod's
# 5-duplicate-certificates-per-week limit. No need to delete the Secret on a
# swap: cert-manager compares the Secret's issuer annotation to issuerRef and
# re-issues on mismatch, serving the old cert until the new one lands.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-dev-wretchedhive-io
  namespace: traefik
spec:
  secretName: wildcard-dev-wretchedhive-io-tls
  commonName: "*.dev.wretchedhive.io"
  dnsNames:
    - "dev.wretchedhive.io"
    - "*.dev.wretchedhive.io"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
