---
# Traefik + Gateway API data plane, per cluster.
#
# A LIST generator rather than the cluster generator used by other platform
# components (ADR-0008): Traefik is not wanted on every registered cluster, and
# the two clusters that do run it need materially different exposure. Adding a
# cluster here is a deliberate act.
#
# Per-cluster divergence lives in the generator ELEMENTS, not in forked
# ApplicationSets — see ADR-0010:
#
#   edge — K3s bundles klipper-lb (`servicelb`), so a LoadBalancer Service gets
#          an EXTERNAL-IP and klipper opens 80/443 on every node itself. Traefik
#          must NOT bind hostPorts here or it collides with klipper.
#   mgmt — RKE2 ships no service load balancer, so a LoadBalancer Service would
#          sit <pending> forever. Traefik runs as a DaemonSet binding hostPorts
#          80/443 directly, reproducing rke2-ingress-nginx's exposure model so
#          the existing Pi-hole round-robin A records keep working unchanged.
#
# `values` is a templated STRING rather than `valuesObject` specifically so the
# hostPort block can be conditional — the Traefik chart treats `hostPort: null`
# as "no hostPort", and there is no scalar that means "omit me" inside a
# structured valuesObject. Same style the cert-manager appset already uses.
#
# NOTE goTemplateOptions has missingkey=error: every key referenced below must
# be present on EVERY element.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: traefik
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: edge
            wildcardHostname: "*.edge.wretchedhive.io"
            wildcardSecret: wildcard-edge-wretchedhive-io-tls
            deploymentKind: Deployment
            serviceType: LoadBalancer
            hostPorts: false
          - name: mgmt
            wildcardHostname: "*.mgmt.wretchedhive.io"
            wildcardSecret: wildcard-mgmt-wretchedhive-io-tls
            deploymentKind: DaemonSet
            serviceType: ClusterIP
            hostPorts: true
  template:
    metadata:
      name: 'traefik-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      sources:
        - repoURL: ghcr.io/traefik/helm
          chart: traefik
          targetRevision: 41.0.0
          helm:
            releaseName: traefik
            values: |
              providers:
                kubernetesGateway:
                  enabled: true
                kubernetesIngress:
                  enabled: false
              deployment:
                kind: {{ .deploymentKind }}
              service:
                # NOTE: the Service type lives at service.spec.type in this chart,
                # NOT service.type. Setting the latter is silently ignored and you
                # get the chart default (LoadBalancer) — caught by rendering.
                spec:
                  type: {{ .serviceType }}
              ports:
                web:
                  port: 8000
                  {{- if .hostPorts }}
                  hostPort: 80
                  {{- end }}
                websecure:
                  port: 8443
                  {{- if .hostPorts }}
                  hostPort: 443
                  {{- end }}
              gateway:
                name: yavin
                listeners:
                  web:
                    port: 8000
                    protocol: HTTP
                    namespacePolicy:
                      from: All
                  websecure:
                    port: 8443
                    protocol: HTTPS
                    hostname: "{{ .wildcardHostname }}"
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: {{ .wildcardSecret }}
                    namespacePolicy:
                      from: All
              gatewayClass:
                enabled: true
        - repoURL: https://github.com/cruno91/homelab-gitops.git
          targetRevision: main
          path: 'platform/traefik/extras/{{ .name }}'
      destination:
        # ADR-0007: Argo's in-cluster connection is named `in-cluster`, not `mgmt`,
        # and mgmt is NOT registered as a named cluster — verified 2026-09-11, the
        # only cluster Secret is `edge`. So mgmt must be targeted by SERVER URL
        # while edge is targeted by NAME. Argo treats an empty-string `server` or
        # `name` as "not set" and uses whichever sibling is populated.
        server: '{{ if eq .name "mgmt" }}https://kubernetes.default.svc{{ end }}'
        name: '{{ if ne .name "mgmt" }}{{ .name }}{{ end }}'
        namespace: traefik
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
