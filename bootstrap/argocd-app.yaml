apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # mgmt-bootstrap manages this Application (via clusters/mgmt). The
    # finalizer below means deleting it deletes Argo CD itself, so mgmt-bootstrap
    # must never prune it (if it leaves git) or delete it (if mgmt-bootstrap is
    # deleted). Removing Argo CD stays a deliberate, manual act.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.11.6
      helm:
        valueFiles:
          - $values/bootstrap/argocd-values.yaml
    - repoURL: https://github.com/cruno91/homelab-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
