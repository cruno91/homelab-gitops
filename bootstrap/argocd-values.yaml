global:
  # Drives the server ingress hostname AND the `url` in argocd-cm that the UI uses
  # for self-links — one value covers both, so no configs.cm.url override is needed.
  domain: argocd.mgmt.wretchedhive.io

server:
  # Pi-hole round-robins argocd.mgmt.wretchedhive.io to the three RKE2 nodes.
  # Since W2, Traefik (DaemonSet on hostPort 443 — ADR-0010) terminates TLS at
  # the `yavin` Gateway and speaks plain HTTP to argocd-server. The addresses are
  # unchanged from the ingress-nginx era, which is why no DNS change was needed.
  service:
    type: ClusterIP
  # plan v2 W2: exposure moved from the chart's Ingress to an HTTPRoute on the
  # shared `yavin` Gateway (apps/mgmt-control-plane/httproute-argocd.yaml), with
  # Traefik terminating TLS using the *.mgmt.wretchedhive.io wildcard.
  #
  # `server.insecure: true` below stays as-is: argocd-server keeps speaking plain
  # HTTP and Traefik does TLS, exactly as it did behind ingress-nginx. gRPC-web
  # for the CLI works over this.
  #
  # DO NOT FLIP TO false BEFORE Traefik is serving on mgmt — with no Ingress and
  # no working Gateway, the Argo CD UI and CLI are unreachable. (Reconciliation
  # keeps running either way; it does not use the ingress.)
  ingress:
    enabled: false

configs:
  params:
    server.insecure: "true"
  cm:
    application.instanceLabelKey: argocd.argoproj.io/instance
    timeout.reconciliation: 180s
    # Suppress benign Synced=OutOfSync drift caused by CRD-schema defaults
    # the API server fills in on apply but git doesn't list. Argo's diff
    # logic for HTTPRoute and Gateway doesn't reconcile these on its own
    # (VAPB does — handled via SSA managedFields stabilization without
    # needing an entry here). Applies cluster-wide to the listed kinds, so
    # any future HTTPRoute / Gateway resource is covered automatically.
    # Drop a jqPathExpression only if the field starts mattering (e.g. you
    # want to deliberately set backendRefs[].weight on an HTTPRoute).
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_HTTPRoute: |
      jqPathExpressions:
        - .spec.parentRefs[]?.group
        - .spec.parentRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.group
        - .spec.rules[]?.backendRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.weight
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_Gateway: |
      jqPathExpressions:
        - .spec.listeners[]?.tls.certificateRefs[]?.group
        - .spec.listeners[]?.tls.certificateRefs[]?.kind

dex:
  enabled: false

notifications:
  enabled: false

# --- KSOPS Config Management Plugin --------------------------------------
# Adds a sidecar to argocd-repo-server that decrypts SOPS-encrypted files
# (`*.enc.yaml`) at manifest-generation time. Per ADR-0005, wired only once
# a real encrypted secret needs to sync — that trigger is now: Cloudflare
# API token storage for cert-manager Let's Encrypt DNS-01.
#
# Prerequisites (out-of-band, not in git):
#   1. `sops-age` Secret in the `argocd` namespace with key `keys.txt`
#      holding the age private key from ~/.config/sops/age/keys.txt.
#      Loss of that Secret = loss of decryption ability across the cluster.
#
# The sidecar image tag MUST track the argo-cd chart's appVersion. When
# `bootstrap/argocd-app.yaml`'s targetRevision is bumped, verify with:
#   kubectl -n argocd get deploy argocd-repo-server \
#     -o jsonpath='{.spec.template.spec.containers[0].image}'
# and update `repoServer.extraContainers[0].image` below to match. A mismatch
# risks socket / protocol drift between cmp-server and repo-server.
repoServer:
  env:
    # Where the ksops sidecar looks for the age key file. The `sops-age`
    # Secret is mounted at /.config/sops/age below.
    - name: XDG_CONFIG_HOME
      value: /.config
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: cmp-plugin
      configMap:
        name: cmp-plugin
    - name: sops-age
      secret:
        secretName: sops-age
  initContainers:
    # Copies static ksops + kustomize binaries out of the ksops image into
    # a shared volume the sidecar reads. Standalone image so the sidecar
    # itself stays a plain argocd image (see version-pin caveat above).
    #
    # ksops is an "alpha exec plugin" — kustomize's alpha-plugin loader
    # requires the binary at a specific relative path under the plugin
    # root: <root>/<apiVersion-group>/<apiVersion-version>/<kind>/<kind>.
    # For the ksops generator we declare (viaduct.ai/v1, kind: ksops),
    # that path is viaduct.ai/v1/ksops/ksops. The sidecar's
    # KUSTOMIZE_PLUGIN_HOME env below points at /custom-tools/plugins.
    - name: install-ksops
      image: viaductoss/ksops:v4.3.3
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          echo "Installing KSOPS..."
          # Older KSOPS docs referenced `ksops-static`; the v4.3.x images
          # ship a single statically-linked binary called just `ksops`
          # (alongside kustomize) under WORKDIR /usr/local/bin.
          mkdir -p /custom-tools/plugins/viaduct.ai/v1/ksops
          mv ksops /custom-tools/plugins/viaduct.ai/v1/ksops/ksops
          mv kustomize /custom-tools/kustomize
          echo "Done."
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  extraContainers:
    - name: ksops
      # Pin: matches argo-cd chart 9.5.21 appVersion. See comment above.
      image: quay.io/argoproj/argocd:v3.4.3
      command: [/var/run/argocd/argocd-cmp-server]
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /.config/sops/age/keys.txt
        - name: XDG_CONFIG_HOME
          value: /.config
        # Where kustomize --enable-alpha-plugins looks for exec plugins.
        # The install-ksops init container above lays out the ksops binary
        # under this root at viaduct.ai/v1/ksops/ksops (the path kustomize
        # derives from the generator's apiVersion + kind).
        - name: KUSTOMIZE_PLUGIN_HOME
          value: /custom-tools/plugins
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      volumeMounts:
        # var-files, plugins, tmp are pod-scoped emptyDirs the chart already
        # defines on repo-server; the sidecar shares them for the cmp-server
        # unix socket and workdir.
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /tmp
          name: tmp
        - mountPath: /custom-tools
          name: custom-tools
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: plugin.yaml
          name: cmp-plugin
        - mountPath: /.config/sops/age
          name: sops-age

# ConfigMap carrying the ksops CMP plugin definition. Delivered via the
# chart's extraObjects so it stays alongside the argocd install and gets
# reconciled with the rest of argocd-values.yaml.
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cmp-plugin
      namespace: argocd
    data:
      plugin.yaml: |
        apiVersion: argoproj.io/v1alpha1
        kind: ConfigManagementPlugin
        metadata:
          name: ksops
        spec:
          allowConcurrency: true
          # Only route through KSOPS if the source directory actually
          # contains a SOPS-encrypted file. Everywhere else the built-in
          # kustomize path runs unchanged — no behavior shift for the
          # platform components that already synced pre-KSOPS.
          discover:
            find:
              command: [sh, -c, "find . -name '*.enc.yaml' | head -1"]
          generate:
            command: [/custom-tools/kustomize]
            args: [build, --enable-alpha-plugins, --enable-exec, .]
          lockRepo: false
