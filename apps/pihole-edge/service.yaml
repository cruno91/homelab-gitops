---
# k3s ServiceLB (klipper) binds port 53 on every edge node IP (10.0.3.3-.5),
# the same way Traefik answers on 80/443. externalTrafficPolicy: Cluster so a
# node with no local Pi-hole pod still forwards to one that has it. Only Ready
# pods (synced, resolving local records) sit behind the Service.
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  namespace: pihole
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: pihole
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
