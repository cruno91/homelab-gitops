---
# Per-cluster Applications for `mgmt`. The platform-mgmt umbrella below applies
# the cross-cluster platform ApplicationSets (cert-manager, ...) to mgmt's
# argocd namespace; each ApplicationSet then fans its workload Applications
# out to every registered cluster (mgmt + edge + dev). mgmt-only workloads
# (Harbor in Week 11, etc.) get their own Applications added here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-mgmt
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cruno91/homelab-gitops.git
    targetRevision: main
    path: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
# mgmt-only Let's Encrypt Certificates for the mgmt plane (ADR-0009, plan v2 W1).
# Kept here rather than platform/cert-manager/extras/ because that source is
# fanned out to EVERY registered cluster by the cert-manager ApplicationSet —
# these certs are mgmt-only (D1, 2026-07-10). Interim home: W2 moves mgmt TLS
# termination to Traefik and this relocates to extras/mgmt/.
# Currently syncs only the argocd-namespace cert; the cattle-system cert is
# staged in apps/mgmt-tls/cert-rancher.yaml but excluded from its kustomization
# until the Phase 4 Rancher cutover.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-tls
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cruno91/homelab-gitops.git
    targetRevision: main
    path: apps/mgmt-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
# HTTPRoutes for the mgmt control planes (plan v2 W2). Replaces the
# chart-managed Ingresses that rke2-ingress-nginx served.
#
# DO NOT MERGE THIS BEFORE THE CUTOVER WINDOW. The routes attach to the `yavin`
# Gateway, which does not exist on mgmt until traefik-mgmt syncs — and Traefik
# cannot bind its hostPorts until rke2-ingress-nginx is disabled. Merging early
# leaves routes dangling against a Gateway that is not Programmed.
# Ordering: docs/runbooks/mgmt-httproute-migration.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-control-plane
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cruno91/homelab-gitops.git
    targetRevision: main
    path: apps/mgmt-control-plane
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
