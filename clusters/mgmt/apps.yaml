---
# Per-cluster Applications for `mgmt`. The platform-mgmt umbrella below applies
# the cross-cluster platform ApplicationSets (cert-manager, ...) to mgmt's
# argocd namespace; each ApplicationSet then fans its workload Applications
# out to every registered cluster (mgmt + edge + dev). mgmt-only workloads
# (Harbor in Week 11, etc.) get their own Applications added here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-mgmt
  namespace: argocd
  # DELIBERATELY NO resources-finalizer (ADR-0011). This Application manages
  # ApplicationSet/{cert-manager,gateway-api,traefik}. With the finalizer, deleting
  # it would cascade into all three ApplicationSets -> every Application they
  # generate -> and because THOSE carry the finalizer, cert-manager, Traefik and the
  # Gateway API CRDs would be torn out of EVERY registered cluster. One mistaken
  # delete would drop the data plane on mgmt and edge at once.
  # Orphaning three ApplicationSets is trivially recoverable; that is not.
spec:
  project: default
  source:
    repoURL: https://github.com/cruno91/homelab-gitops.git
    targetRevision: main
    path: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
# HTTPRoutes for the mgmt control planes (plan v2 W2). Replaces the
# chart-managed Ingresses that rke2-ingress-nginx served.
#
# DO NOT MERGE THIS BEFORE THE CUTOVER WINDOW. The routes attach to the `yavin`
# Gateway, which does not exist on mgmt until traefik-mgmt syncs — and Traefik
# cannot bind its hostPorts until rke2-ingress-nginx is disabled. Merging early
# leaves routes dangling against a Gateway that is not Programmed.
# Ordering: docs/runbooks/mgmt-httproute-migration.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-control-plane
  namespace: argocd
  finalizers:
    # Cascade on delete (ADR-0011): removing this Application should remove the
    # workload it describes. Without this, deleting it orphans the resources —
    # they keep running, unmanaged and invisible to GitOps (the W2 mgmt-tls
    # certificates are the worked example).
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cruno91/homelab-gitops.git
    targetRevision: main
    path: apps/mgmt-control-plane
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
