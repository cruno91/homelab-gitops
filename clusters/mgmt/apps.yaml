---
# Per-cluster Applications for `mgmt`. The platform-mgmt umbrella below applies
# the cross-cluster platform ApplicationSets (cert-manager, ...) to mgmt's
# argocd namespace; each ApplicationSet then fans its workload Applications
# out to every registered cluster (mgmt + edge + dev). mgmt-only workloads
# (Harbor in Week 11, etc.) get their own Applications added here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-mgmt
  namespace: argocd
  # DELIBERATELY NO resources-finalizer (ADR-0011). This Application manages
  # ApplicationSet/{cert-manager,gateway-api,traefik}. With the finalizer, deleting
  # it would cascade into all three ApplicationSets -> every Application they
  # generate -> and because THOSE carry the finalizer, cert-manager, Traefik and the
  # Gateway API CRDs would be torn out of EVERY registered cluster. One mistaken
  # delete would drop the data plane on mgmt and edge at once.
  # Orphaning three ApplicationSets is trivially recoverable; that is not.
spec:
  project: default
  source:
    repoURL: https://github.com/cruno91/homelab-gitops.git
    targetRevision: main
    path: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
# HTTPRoutes for the mgmt control planes (plan v2 W2). Replaces the
# chart-managed Ingresses that rke2-ingress-nginx served.
#
# DO NOT MERGE THIS BEFORE THE CUTOVER WINDOW. The routes attach to the `yavin`
# Gateway, which does not exist on mgmt until traefik-mgmt syncs — and Traefik
# cannot bind its hostPorts until rke2-ingress-nginx is disabled. Merging early
# leaves routes dangling against a Gateway that is not Programmed.
# Ordering: docs/runbooks/mgmt-httproute-migration.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mgmt-control-plane
  namespace: argocd
  finalizers:
    # Cascade on delete (ADR-0011): removing this Application should remove the
    # workload it describes. Without this, deleting it orphans the resources —
    # they keep running, unmanaged and invisible to GitOps (the W2 mgmt-tls
    # certificates are the worked example).
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cruno91/homelab-gitops.git
    targetRevision: main
    path: apps/mgmt-control-plane
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
# Harvester guest-cluster definitions (ADR-0012). Lives on mgmt because that is
# where Rancher and its CAPI controllers run; the CRs here describe clusters
# that come up on yavin-prime.
#
# To add a cluster: drop a <name>.yaml in apps/harvester-clusters/, add it to
# that kustomization, merge. That is the whole workflow.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harvester-clusters
  namespace: argocd
  # DELIBERATELY NO resources-finalizer (ADR-0011/ADR-0012). These CRs are the
  # only handle on real Kubernetes clusters and their VMs. The standing policy
  # is "cascade on delete EXCEPT for things we want to survive a mistaken
  # Application deletion" - a whole cluster is the clearest possible case.
  # Orphaning a Cluster CR is trivially recoverable; destroying etcd is not.
spec:
  project: default
  source:
    repoURL: https://github.com/cruno91/homelab-gitops.git
    targetRevision: main
    path: apps/harvester-clusters
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet-default
  # Rancher's machine-pool controller writes `dynamicSchemaSpec` onto every
  # machinePool - a ~6KB JSON blob describing the Harvester driver's field
  # schema. It is generated metadata, not configuration: it is specific to the
  # installed driver version, so committing it would mean re-vendoring a 6KB
  # blob on every Rancher upgrade.
  #
  # Without this, Argo sees permanent drift and `selfHeal: true` strips the
  # field on every sync while Rancher writes it straight back - an endless
  # fight. Every OTHER field Rancher server-side-defaults is declared
  # explicitly in apps/harvester-clusters/dev.yaml; this is the sole exception.
  #
  # RespectIgnoreDifferences below is what makes this work: without it,
  # ignoreDifferences only hides the diff, and sync would still send a
  # machinePools array with the field absent.
  ignoreDifferences:
    - group: provisioning.cattle.io
      kind: Cluster
      jqPathExpressions:
        - '.spec.rkeConfig.machinePools[].dynamicSchemaSpec'
  syncPolicy:
    automated:
      # prune: false, UNLIKE every other Application in this repo. With prune on,
      # deleting a line from apps/harvester-clusters/kustomization.yaml would
      # delete a running cluster. Combined with the missing finalizer above, it
      # now takes two deliberate acts to destroy one. Cluster teardown is an
      # explicit operation (Rancher UI or kubectl), not a side effect of an edit.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # Makes ignoreDifferences apply to the sync payload, not just the diff.
      - RespectIgnoreDifferences=true
