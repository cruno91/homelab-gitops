---
# Per-cluster Applications for `dev` (Harvester guest K3s). Pointed at apps/<name>/
# paths. Platform components (cert-manager, gateway-api, traefik) reach dev via
# their own cluster-generator ApplicationSets in platform/, not from here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-dev
  namespace: argocd
  finalizers:
    # Cascade on delete (ADR-0011): removing this Application should remove the
    # workload it describes. Without this, deleting it orphans the resources —
    # they keep running, unmanaged and invisible to GitOps.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cruno91/homelab-gitops.git
    targetRevision: main
    path: apps/hello-world-dev
  destination:
    name: dev
    namespace: hello-world
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
