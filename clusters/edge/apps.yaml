---
# Per-cluster Applications for `edge` (Pi K3s). Pointed at apps/<name>/ paths.
# Platform components (cert-manager, envoy-gateway) reach edge via their own
# cluster-generator ApplicationSets in platform/, not from here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-edge
  namespace: argocd
  finalizers:
    # Cascade on delete (ADR-0011): removing this Application should remove the
    # workload it describes. Without this, deleting it orphans the resources —
    # they keep running, unmanaged and invisible to GitOps (the W2 mgmt-tls
    # certificates are the worked example).
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cruno91/homelab-gitops.git
    targetRevision: main
    path: apps/hello-world
  destination:
    name: edge
    namespace: hello-world
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# Backup Pi-hole (primary is yavin1's Docker Pi-hole). Stateless; config is
# synced from yavin1 by a nebula-sync sidecar. See apps/pihole-edge/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole-edge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cruno91/homelab-gitops.git
    targetRevision: main
    path: apps/pihole-edge
    # Force the ksops CMP sidecar; Argo's built-in kustomize would refuse the
    # ksops exec generator. Same wiring as platform/cert-manager/appset.yaml.
    plugin:
      name: ksops
  destination:
    name: edge
    namespace: pihole
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
